# Типы нумеруются по возрастанию медианных трат жителя (mopeers.typology).
# Названия и краткие описания — по профилям outputs/interpret/profile_median.csv и регионам МО типа.
# Цвет — одна карта на тип (серый фон).
"1":
  name: Стареющая глубинка
  color: "#2a78d6"
  short: Малые районы Центра и Поволжья. Больше всего пожилых, наибольшие доли продовольствия и маркетплейсов в тратах, самые низкие траты на жителя.
"2":
  name: Удалённая периферия
  color: "#1baf7a"
  short: Районы Сибири и Приуралья с низкой доступностью рынков. Много детей, высокие доли занятых в госуправлении и сельском хозяйстве, траты чуть выше глубинки.
"3":
  name: Города и промышленные центры
  color: "#eb6834"
  short: Крупные и средние города, в том числе 59 центров субъектов. Горожан 92%, почти каждый четвёртый занятый — в обработке, высокий розничный оборот и платные услуги.
"4":
  name: Ресурсные территории
  color: "#c98500"
  short: Добывающие районы Якутии, Югры, Сахалина и Ямала. Каждый седьмой занятый — в добыче, инвестиции на жителя в 8 раз выше медианы страны, самая низкая доступность рынков, траты — наименьшая доля зарплаты.
"5":
  name: Столицы и ближнее Подмосковье
  color: "#4a3aa7"
  short: Районы Москвы и Петербурга и 16 городов Московской области. Самые высокие траты на жителя, наибольшие доли общепита и транспорта, наименьшая — продуктов, самый большой приток жителей.
