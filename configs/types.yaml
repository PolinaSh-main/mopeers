# Типы нумеруются по возрастанию медианных трат жителя (mopeers.typology).
# Названия и краткие описания — по профилям outputs/interpret/profile_median.csv и регионам МО типа.
# Цвет — одна карта на тип (серый фон).
"1":
  name: Убывающие районы Центра и Поволжья
  color: "#2a78d6"
  short: Малые районы Кировской, Нижегородской, Саратовской, Тверской, Рязанской областей. Смертность 17,7 на 1 000 жителей при рождаемости 6,7, население убывает на 1,4% в год. Самые низкие траты на жителя и наибольшая доля маркетплейсов в них.
"2":
  name: Сельские районы Сибири и Урала
  color: "#1baf7a"
  short: Районы Алтайского и Красноярского краёв, Башкортостана, Омской и Иркутской областей, в большинстве без городского населения. Много детей, самый большой отток жителей, почти в половине районов больше 5% занятых — в сельском хозяйстве.
"3":
  name: Города и промышленные центры
  color: "#eb6834"
  short: Средние и крупные города, в том числе 43 центра субъектов. Горожан 87%, у 86% МО больше 5% занятых — в обработке, в среднем обработка даёт четверть рабочих мест.
"4":
  name: Ресурсные территории
  color: "#c98500"
  short: Районы Якутии, Югры, Сахалина, Ямала и Камчатки. В 56% МО больше 5% занятых — в добыче, инвестиции на жителя в 8 раз выше медианы страны, самая низкая доступность рынков, траты — наименьшая доля зарплаты.
"5":
  name: Мегаполисы и их пригороды
  color: "#4a3aa7"
  short: Районы Москвы и Петербурга, 14 крупнейших городов (Казань, Новосибирск, Екатеринбург, Нижний Новгород, Самара и другие) и их пригороды. Самые высокие траты на жителя, наибольшие доли общепита и транспорта, самый большой приток жителей.
