# Названия и краткие описания типов — по профилям outputs/interpret/profile_median.csv
# и описаниям-понятиям outputs/interpret/fca_descriptions.json. Цвет — одна карта на тип (серый фон).
"1.1":
  name: Стареющая глубинка
  color: "#2a78d6"
  short: Малые районы Центра и Поволжья. Много пожилых, основная статья трат — продукты, заметная доля маркетплейсов, траты на жителя самые низкие.
"1.2":
  name: Удалённая периферия
  color: "#1baf7a"
  short: Районы Сибири, Урала и Дальнего Востока с низкой доступностью рынков. Много детей, высокая доля занятых в госуправлении, траты чуть выше глубинки.
"2.1":
  name: Города и промышленные центры
  color: "#eb6834"
  short: Крупные и средние города, в том числе пригороды Москвы. Почти все жители — горожане, каждый пятый занятый — в обработке, высокий розничный оборот и платные услуги.
"2.2":
  name: Столичные районы
  color: "#4a3aa7"
  short: Районы Москвы и Петербурга. Самые высокие траты на жителя, наибольшая доля общепита и транспорта, наименьшая — продуктов.
"2.3":
  name: Ресурсные территории
  color: "#c98500"
  short: Добывающие районы Севера и Дальнего Востока. Каждый четвёртый занятый — в добыче, инвестиции на жителя в 14 раз выше медианы страны, траты составляют наименьшую долю зарплаты.
